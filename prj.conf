CONFIG_GPIO=y

# SPI2 is driven directly via LL by src/mdioprobe_mdio_api.c. The Zephyr
# driver is kept ONLY so its init applies the spi2 pinctrl group
# (PB12/PB13/PB15 → AF5). Application code never calls the SPI API — the
# stm32 slave-mode driver has races (Tx dma_stop failure, RX FIFO desync
# on re-arm) that proved fatal for back-to-back captures on g474.
CONFIG_SPI=y
CONFIG_SPI_SLAVE=y

CONFIG_ADC=y

# The vreg control tick (TIM6, 20 kHz) is registered as a zero-latency IRQ so
# irq_lock() cannot mask it — the bitbang MDIO master holds the lock for a
# whole ~430 µs frame, and a starved regulator loses the rail entirely
# (measured 2.7 V of swing on a 1.8 V target, 2026-07-30). Rationale and the
# consequences for locking inside the module are in src/mdioprobe_vreg.c.
CONFIG_ZERO_LATENCY_IRQS=y
# CONFIG_DAC is intentionally off:
#  - DAC3_CH1 (MDC threshold) and DAC4_CH1 (MDIO threshold) are
#    internal-only on STM32G4 — no pin, so no pinctrl, so no Zephyr node;
#  - DAC1_CH1 (vreg gate, PA4) is inside a 10 kHz control loop that needs
#    direct register writes.
# Both are configured via LL (mdioprobe_adc_dac.c / mdioprobe_vreg.c).

# QSPI NOR: Winbond W25Q80DVSNIG (8 Mbit).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_STM32_QSPI=y
# The QSPI driver logs a dozen INFO lines about SFDP parsing on every boot.
# It registers with CONFIG_FLASH_LOG_LEVEL, so this quiets it without
# touching the driver. Note it covers every flash driver, not just QSPI.
CONFIG_FLASH_LOG_LEVEL_WRN=y

# Alternate personalities of the target connector (PB8/PB9). Both drivers
# are built in and their pins re-muxed at runtime by mdioprobe_serial.c,
# so changing the connector's role needs no reflash.
# The console is USB CDC ACM, and the USB device is built by this firmware
# rather than by the cdc-acm-console snippet.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_MSC_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_I2C=y
# Runtime re-muxing of PB8/PB9 between MDIO / USART3 / I2C1: DYNAMIC makes
# the drivers' pinctrl configs reachable from the app, KEEP_SLEEP_STATE
# keeps the Analog "sleep" state in the build (it is dropped by default
# outside of PM builds).
CONFIG_PINCTRL_DYNAMIC=y
CONFIG_PINCTRL_KEEP_SLEEP_STATE=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
# The MicroPython REPL and the log backend share one CDC ACM port, so keep
# the log to events that are worth interrupting a command line for.
CONFIG_LOG_MAX_LEVEL=2
CONFIG_LOG_BUFFER_SIZE=16384

# Staging buffer of the shell's log backend, in BYTES (shell_uart.c divides
# it by sizeof(uint32_t)). The 512-byte default overflows during boot: with
# CHECK_DTR the output is held back until the USB terminal is opened, while
# driver init keeps logging — the buffer is MPSC_PBUF_MODE_OVERWRITE, so the
# oldest messages are dropped and you get "--- N messages dropped ---".
# Receive ring buffer. The 64-byte default is smaller than legitimate
# commands: `flash write <device> <addr> <dword>...` with a device name like
# "qspi-nor-flash@90000000" passes 64 characters with only two data words, and
# a host that pastes the line rather than typing it overruns the buffer
# mid-command. The shell then executes the truncated remainder and reports a
# verification error that has nothing to do with the flash (seen 2026-07-30).
# Long commands also need somewhere to be assembled once received.
# `kernel reboot cold|warm`. The delay lets the shell echo the command out
# over CDC ACM before the reset tears USB enumeration down — without it the
# host usually loses the line before seeing any acknowledgement.

# USB device (console/shell backend). The `cdc-acm-console` snippet, added
# from CMakeLists.txt, turns on USB_DEVICE_STACK_NEXT and points
# zephyr,console + zephyr,shell-uart at the CDC ACM UART.
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Meshium"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="MDIO Probe v2"
# TODO: VID/PID are Zephyr's test IDs — replace before shipping hardware.
CONFIG_CDC_ACM_SERIAL_VID=0x2fe3
CONFIG_CDC_ACM_SERIAL_PID=0x0004

CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_USE_MODULE=n

# --- MicroPython ---
# The interpreter runs in the main thread and sizes its own stack check from
# CONFIG_MAIN_STACK_SIZE, so this is the REPL's stack too.
CONFIG_MAIN_STACK_SIZE=8192
# ports/zephyr/mphalport.c parks the interpreter on a k_poll signal while it
# waits for console input, instead of spinning.
CONFIG_POLL=y
# Console RX/TX rings for the interpreter's tty layer (ports/zephyr/uart_core.c).
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y
CONFIG_CONSOLE_GETCHAR_BUFSIZE=256
CONFIG_CONSOLE_PUTCHAR_BUFSIZE=256

# Our own MicroPython configuration header, not the port's minimal one.
CONFIG_MICROPY_CONFIGFILE="mpconfigport_mdioprobe.h"
# A static array in the port's main.c, so it is .bss and fixed at link time.
# 64 KB (what the previous project used) does not leave enough of this
# board's 128 KB for the capture ring, vreg loop, detector and USB.
CONFIG_MICROPY_HEAP_SIZE=49152
CONFIG_MICROPY_FROZEN_MODULES=y
CONFIG_MICROPY_FROZEN_MANIFEST="micropython_manifest.py"
# MicroPython's own FatFs stays out: the FAT volume belongs to Zephyr and
# reaches Python through zephyr.FileSystem.
CONFIG_MICROPY_VFS_FAT=n

# --- Storage: FAT on the QSPI NOR ---
# A flash-disk block device over the storage partition, with Zephyr's FatFs
# on top. FAT rather than LittleFS because a host has to be able to read the
# volume directly over USB MSD without a driver.
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_FLASH=y
CONFIG_FILE_SYSTEM=y
# Silence the filesystem subsystem's own logging. A missing file is an
# ordinary outcome of a CLI command, and fs.c reports it at ERR level, which
# lands on top of the user's prompt. Every filesystem failure already reaches
# the operator through the command that caused it, so the second copy adds
# only interleaving. Note WRN is not enough here: a module at WRN still emits
# ERR.
CONFIG_FS_LOG_LEVEL_OFF=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_MKFS=y
# Format when the mount fails, i.e. on a blank chip. Convenient for a bench
# instrument; a product would want this behind a deliberate user action,
# because a transient read failure would take the volume with it.
CONFIG_FS_FATFS_MOUNT_MKFS=y

# f_getlabel()/f_setlabel(). The volume shows up on a host as MDIOPROBE
# rather than NO NAME, which matters because `msd` is how files get onto the
# probe and an unlabelled drive is one more thing to identify by size.
CONFIG_FS_FATFS_EXTRA_NATIVE_API=y
# Long filenames. Not cosmetic: without them FAT stores 8.3 names in upper
# case, so a script saved as `probe.py` lands on the volume as `PROBE.PY`
# and `import probe` cannot find it — which would defeat the whole reason
# for putting MicroPython's VFS over this volume. The working buffer is
# (MAX_LFN + 1) * 2 bytes in .bss; 64 covers any sane filename at 130 B.
# FatFs only accepts volume strings from a built-in list (RAM, NAND, CF,
# SD, ...) unless custom ones are declared. Declaring ours is worth two
# lines: the chip is NOR flash, so calling the volume NAND would be plainly
# wrong, and the name ends up in every path a user types.
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=1
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="flash"

CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y
CONFIG_FS_FATFS_MAX_LFN=64
